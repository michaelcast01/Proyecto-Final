services:
  # Backend Service
  - type: web
    name: tienda-suplementos-backend
    runtime: docker
    plan: starter # Free tier - upgrade to 'starter' for production
    region: oregon # Change to your preferred region
    branch: main
    dockerfilePath: ./Dockerfile
    
    # Environment variables
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: DB_URL
        fromDatabase:
          name: tienda-suplementos-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: tienda-suplementos-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: tienda-suplementos-db
          property: password
      - key: STRIPE_SECRET_KEY
        sync: false # Set this manually in Render dashboard
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false # Set this manually in Render dashboard
      - key: JAVA_OPTS
        value: -Xmx512m -Xms256m
    
    # Health check endpoint
    healthCheckPath: /actuator/health
    
    # Auto-deploy on push
    autoDeploy: true
    
    # Build command (optional, Docker handles this)
    # buildCommand: mvn clean package -DskipTests
    
    # Start command (handled by Dockerfile)
    # startCommand: java -jar target/*.jar

# Database
databases:
  - name: tienda-suplementos-db
    databaseName: tienda_suplementos
    plan: starter # Free tier - upgrade for production
    region: oregon # Same region as backend
    ipAllowList: [] # Empty = allow all (Render services can connect)
