# fly.toml app configuration file generated for suplements-v1 on 2024-11-21T08:30:00Z

app = 'suplements-v1'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512

[env]
  SPRING_PROFILES_ACTIVE = "production"